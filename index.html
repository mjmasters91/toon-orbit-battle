<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toon Orbit Battle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1228">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toon Orbit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=8">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo"><span class="ring"></span>TOON ORBIT <b>BATTLE</b></div>
    <div class="nav">
      <div class="coinbal hidden" id="coinBal" title="Orbit Coins"><span class="coinicon" aria-hidden="true"></span><span id="coinCount">0</span></div>
      <div class="usermenu hidden" id="userMenu">
        <button type="button" class="btn small userchip" id="btnUser" aria-haspopup="menu" aria-expanded="false" aria-controls="userPop">
          <span class="avatar" id="userAvatar" aria-hidden="true">?</span>
          <span class="uname" id="userName">Player</span>
        </button>
        <div class="usermenu-pop hidden" id="userPop" role="menu">
          <button type="button" class="menuitem" id="btnPacksMenu" role="menuitem">Packs <span class="packbadge" data-packbadge></span></button>
          <button type="button" class="menuitem hidden" id="btnAdmin" role="menuitem">Admin</button>
          <button type="button" class="menuitem" id="btnMyCollection" role="menuitem">My Collection</button>
          <button type="button" class="menuitem" id="btnLogOut" role="menuitem">Log out</button>
        </div>
      </div>
      <button class="btn small" id="btnHome"><span class="lbl-full">Home</span><span class="lbl-short">Home</span></button>
      <button class="btn small" id="btnRules"><span class="lbl-full">How to Play</span><span class="lbl-short">Rules</span></button>
      <button class="btn small" id="btnNew"><span class="lbl-full">New Game</span><span class="lbl-short">New</span></button>
      <button class="btn small" id="btnSound"><span class="lbl-full">Sound: On</span><span class="lbl-short">On</span></button>
    </div>
  </header>
  <main class="layout">
    <aside class="left">
      <div id="scoreboard" class="box"></div>
      <div class="box tv"><div class="tv-title">Preview</div><div id="inspector"></div></div>
    </aside>
    <section class="arena">
      <div class="ohandrow"><span class="ohandlabel">Their hand</span><div id="o-hand"></div></div>
      <div class="side opp">
        <div class="sidelabel">Opponent</div>
        <div class="row outer" id="o-outer"></div>
        <div class="row inner" id="o-inner"></div>
      </div>
      <div class="midline"><div id="phaseMsg">Welcome to Toon Orbit Battle!</div><div id="timer"></div></div>
      <div class="side me">
        <div class="sidelabel">You</div>
        <div class="row inner" id="p-inner"></div>
        <div class="row outer" id="p-outer"></div>
      </div>
    </section>
    <aside class="right"><div id="decks"></div></aside>
  </main>
  <footer class="handbar">
    <div class="handlabel">Hand</div>
    <div id="hand"></div>
    <div id="actions"></div>
  </footer>
  <div id="overlay" class="hidden"></div>
  <div id="reward" class="hidden" role="dialog" aria-modal="true" aria-label="New toon"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="preview" class="preview hidden" role="dialog" aria-modal="true" aria-label="Card preview">
    <button type="button" class="preview-backdrop" id="previewBackdrop" aria-label="Close preview"></button>
    <div class="preview-sheet">
      <button type="button" class="btn preview-close" id="btnPreviewClose">Close</button>
      <div id="previewBody"></div>
    </div>
  </div>
</div>
<script src="cards.js?v=8"></script>
<script src="copies.js?v=8"></script>
<script src="engine.js?v=8"></script>
<script src="ai.js?v=8"></script>
<script src="art.js?v=8"></script>
<script src="supabase-config.js?v=8"></script>
<script src="auth.js?v=8"></script>
<script src="game.js?v=8"></script>
</body>
</html>
